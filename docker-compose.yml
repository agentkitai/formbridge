services:
  formbridge:
    build: .
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=development
      - FORMBRIDGE_AUTH_ENABLED=false
      - FORMBRIDGE_LOG_FORMAT=pretty
      - FORMBRIDGE_STORAGE=sqlite
      - SQLITE_PATH=/app/data/formbridge.db
    volumes:
      - formbridge-data:/app/data

volumes:
  formbridge-data:
